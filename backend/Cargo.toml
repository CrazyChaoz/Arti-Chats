[package]
name = "magic-chat-rust-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
arti-client = { version= "0.30.0", features=["onion-service-service","onion-service-client","static","experimental-api"] }
tor-cell = "0.30.0"
tor-hsservice = "0.30.0"
tor-proto = "0.30.0"
tor-rtcompat = { version = "0.30.0", features = ["static"] }
tor-llcrypto = "0.30.0"
tor-hscrypto = "0.30.0"
tracing-subscriber = "0.3.18"
anyhow = "1.0.86"
base64 = "0.22.1"
rand = "0.9.1"
sha3 = "0.10"
hyper = { version = "1.4", features = ["http1", "server", "client"] }
tokio = { version="1.40" }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
base32 = "0.5"
ed25519-dalek = "2.1"
futures-util = "0.3.30"
log = "0.4"
futures = "0.3.30"
uniffi = {version = "0.29.1", features = [ "cli" ] }


# dependancies specific to iOS
[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.2.0"


# dependancies specific to Android
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
jni-sys = "0.4.0"
tracing-android = "0.2"

# dependancy to help implementing lockf, for android < 7.0
#libc = "0.2.112"


[lib]
# dylib is for Android, staticlib is for iOS
crate-type = ["cdylib"]#,"staticlib"]
name = "tor_chat"


[build-dependencies]
uniffi = {version = "0.29.1", features = [ "build" ] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"