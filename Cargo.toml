[package]
name = "magic-chat-rust-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
arti-client = { version="0.22", features=["onion-service-service","onion-service-client","static","experimental-api"] }
tor-cell = "0.22"
tor-hsservice = "0.22"
tor-proto = "0.22"
tor-rtcompat = { version = "0.22", features = ["static"] }
tor-hsrproxy = "0.22"
tor-keymgr = "0.22"
tor-llcrypto = "0.22"
tor-dirmgr = { version = "0.22", features = ["static"] }
tor-netdir = "0.22"
tor-hscrypto = "0.22"
tor-persist = "0.22"
tracing-subscriber = "0.3.18"
safelog = "0.3.8"
anyhow = "1.0.86"
base64 = "0.22.1"
rand = "0.8"
sha3 = "0.10"
fs-mistrust = "0.7"
hyper = { version = "1.4", features = ["http1", "server", "client"] }
tokio = { version="1.40" }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
base32 = "0.5"
ed25519-dalek = "2.1"
once_cell = "1.19.0"
futures-util = "0.3.30"
env_logger = "0.11.5"
log = "0.4"
futures = "0.3.30"
uniffi = {version = "0.28.2" }


# dependancies specific to iOS
[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.2.0"


# dependancies specific to Android
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
jni-sys = "0.4.0"
tracing-android = "0.2"

# dependancy to help implementing lockf, for android < 7.0
#libc = "0.2.112"


[lib]
# dylib is for Android, staticlib is for iOS
crate-type = ["cdylib"]#,"staticlib"]
name = "tor_chat"


[build-dependencies]
uniffi = {version = "0.28.2", features = [ "build" ] }

#[[bin]]
#name = "uniffi-bindgen"
#path = "uniffi-bindgen.rs"