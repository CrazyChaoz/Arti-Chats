[package]
name = "magic-chat-rust-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
arti-client = { version="0.22.0", features=["onion-service-service","onion-service-client","static","experimental-api"] }
tor-cell = "0.22"
tor-hsservice = "0.22"
tor-proto = "0.22"
tor-rtcompat = "0.22"
tor-hsrproxy = "0.22"
tor-keymgr = "0.22"
tor-llcrypto = "0.22"
tor-dirmgr = "0.22"
tor-netdir = "0.22"
tor-hscrypto = "0.22"
tor-persist = "0.22"
tracing-subscriber = "0.3.18"
safelog = "0.3.8"
anyhow = "1.0.86"
base64 = "0.22.1"
rand = "0.8"
sha3 = "0.10"
fs-mistrust = "0.7"
hyper = { version = "1.4", features = ["http1", "client"] }
tokio = "1.40"
